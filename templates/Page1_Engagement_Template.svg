<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC" />
  <rect x="0" y="0" width="320" height="1080" fill="#0F172A" />

  <!-- Brand Area -->
  <rect x="25" y="25" width="60" height="60" rx="14" fill="url(#brand-grad)" />
  <text x="42" y="68" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="bold">M</text>
  <text x="102" y="52" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" letter-spacing="1">MARKETING</text>
  <text x="102" y="76" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">ANALYTICS HUB</text>
  <line x1="25" y1="105" x2="295" y2="105" stroke="#1E293B" stroke-width="2" />

  <!-- Nav -->
  <rect x="20" y="130" width="280" height="56" rx="12" fill="#1E293B" />
  <rect x="20" y="140" width="6" height="36" rx="3" fill="#38BDF8" />
  <text x="45" y="165" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="bold">Campaign &amp; Ads</text>
  <text x="45" y="235" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="600">Customer Journey</text>
  <text x="45" y="305" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="600">Customer Reviews</text>
  <line x1="25" y1="340" x2="295" y2="340" stroke="#1E293B" stroke-width="2" />

  <!-- Filters -->
  <text x="25" y="375" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" letter-spacing="1">PAGE FILTERS</text>
  <text x="25" y="412" fill="#F1F5F9" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Date Period</text>
  <rect x="25" y="425" width="270" height="54" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="25" y="515" fill="#F1F5F9" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Product Category</text>
  <rect x="25" y="528" width="270" height="54" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="25" y="618" fill="#F1F5F9" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Content Channel</text>
  <rect x="25" y="631" width="270" height="54" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />

  <!-- Footer -->
  <rect x="20" y="995" width="280" height="60" rx="12" fill="#1E293B" />
  <circle cx="45" cy="1025" r="7" fill="#10B981" />
  <text x="65" y="1022" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="bold">Star Schema Active</text>
  <text x="65" y="1042" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="13">Connected to SQL &amp; PBI</text>

  <!-- Header -->
  <text x="350" y="60" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="bold">Marketing Campaign &amp; Media Performance</text>
  <rect x="1650" y="28" width="235" height="48" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
  <text x="1670" y="58" fill="#1D4ED8" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5">PAGE 1 / 3  •  OVERVIEW</text>

  <!-- KPI Row (Clean: Title only, zero instructions) -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="100" width="368" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 350 116 A 16 16 0 0 1 366 100 L 702 100 A 16 16 0 0 1 718 116 L 718 108 L 350 108 Z" fill="#2563EB" />
  </g>
  <text x="374" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">TOTAL VIEWS</text>
  <circle cx="682" cy="138" r="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="740" y="100" width="368" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 740 116 A 16 16 0 0 1 756 100 L 1092 100 A 16 16 0 0 1 1108 116 L 1108 108 L 740 108 Z" fill="#0891B2" />
  </g>
  <text x="764" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">TOTAL CLICKS</text>
  <circle cx="1072" cy="138" r="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="1130" y="100" width="368" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 1130 116 A 16 16 0 0 1 1146 100 L 1482 100 A 16 16 0 0 1 1498 116 L 1498 108 L 1130 108 Z" fill="#059669" />
  </g>
  <text x="1154" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">CTR (CLICK RATE)</text>
  <circle cx="1462" cy="138" r="18" fill="#ECFDF5" stroke="#059669" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="1520" y="100" width="365" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 1520 116 A 16 16 0 0 1 1536 100 L 1869 100 A 16 16 0 0 1 1885 116 L 1885 108 L 1520 108 Z" fill="#D97706" />
  </g>
  <text x="1544" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">ENGAGEMENTS</text>
  <circle cx="1849" cy="138" r="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />

  <!-- Middle Row Visuals (Clean: Title only) -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="265" width="1010" height="405" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="378" y="306" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Monthly Engagement Trend (Views vs Clicks)</text>

  <g filter="url(#card-shadow)">
    <rect x="1382" y="265" width="503" height="405" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="1406" y="306" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">By Content Type</text>

  <!-- Bottom Row Visuals (Clean: Title only) -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="690" width="760" height="365" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="378" y="732" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Top Performing Products</text>

  <g filter="url(#card-shadow)">
    <rect x="1132" y="690" width="753" height="365" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="1158" y="732" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Category &amp; Price Tiers</text>
</svg>