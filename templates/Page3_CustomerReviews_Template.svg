<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC" />
  <rect x="0" y="0" width="320" height="1080" fill="#0F172A" />

  <!-- Brand Area -->
  <rect x="25" y="25" width="60" height="60" rx="14" fill="url(#brand-grad)" />
  <text x="42" y="68" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="bold">M</text>
  <text x="102" y="52" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" letter-spacing="1">MARKETING</text>
  <text x="102" y="76" fill="#2DD4BF" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">ANALYTICS HUB</text>
  <line x1="25" y1="105" x2="295" y2="105" stroke="#1E293B" stroke-width="2" />

  <!-- Nav -->
  <text x="45" y="165" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="600">Campaign &amp; Ads</text>
  <text x="45" y="235" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="600">Customer Journey</text>
  <rect x="20" y="270" width="280" height="56" rx="12" fill="#1E293B" />
  <rect x="20" y="280" width="6" height="36" rx="3" fill="#2DD4BF" />
  <text x="45" y="305" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="bold">Customer Reviews</text>
  <line x1="25" y1="340" x2="295" y2="340" stroke="#1E293B" stroke-width="2" />

  <!-- Filters -->
  <text x="25" y="375" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" letter-spacing="1">PAGE FILTERS</text>
  <text x="25" y="412" fill="#F1F5F9" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Review Period</text>
  <rect x="25" y="425" width="270" height="54" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="25" y="515" fill="#F1F5F9" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Product Category</text>
  <rect x="25" y="528" width="270" height="54" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="25" y="618" fill="#F1F5F9" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">Rating Filter</text>
  <rect x="25" y="631" width="270" height="54" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />

  <!-- Footer -->
  <rect x="20" y="995" width="280" height="60" rx="12" fill="#1E293B" />
  <circle cx="45" cy="1025" r="7" fill="#10B981" />
  <text x="65" y="1022" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="bold">Star Schema Active</text>
  <text x="65" y="1042" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="13">Fact_customer_reviews</text>

  <!-- Header -->
  <text x="350" y="60" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="bold">Customer Feedback &amp; Product Sentiment</text>
  <rect x="1650" y="28" width="235" height="48" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2" />
  <text x="1670" y="58" fill="#15803D" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" letter-spacing="0.5">PAGE 3 / 3  •  REVIEWS</text>

  <!-- KPI Row (Clean: Title only) -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="100" width="368" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 350 116 A 16 16 0 0 1 366 100 L 702 100 A 16 16 0 0 1 718 116 L 718 108 L 350 108 Z" fill="#0D9488" />
  </g>
  <text x="374" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">TOTAL REVIEWS</text>
  <circle cx="682" cy="138" r="18" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="740" y="100" width="368" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 740 116 A 16 16 0 0 1 756 100 L 1092 100 A 16 16 0 0 1 1108 116 L 1108 108 L 740 108 Z" fill="#F59E0B" />
  </g>
  <text x="764" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">AVERAGE RATING</text>
  <circle cx="1072" cy="138" r="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="1130" y="100" width="368" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 1130 116 A 16 16 0 0 1 1146 100 L 1482 100 A 16 16 0 0 1 1498 116 L 1498 108 L 1130 108 Z" fill="#10B981" />
  </g>
  <text x="1154" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">POSITIVE REVIEWS</text>
  <circle cx="1462" cy="138" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />

  <g filter="url(#card-shadow)">
    <rect x="1520" y="100" width="365" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 1520 116 A 16 16 0 0 1 1536 100 L 1869 100 A 16 16 0 0 1 1885 116 L 1885 108 L 1520 108 Z" fill="#E11D48" />
  </g>
  <text x="1544" y="142" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="21" font-weight="bold" letter-spacing="0.5">NEGATIVE REVIEWS</text>
  <circle cx="1849" cy="138" r="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2" />

  <!-- Middle Row Visuals (Clean: Title only) -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="265" width="580" height="405" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="378" y="306" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Rating Breakdown (1 to 5 Stars)</text>

  <g filter="url(#card-shadow)">
    <rect x="952" y="265" width="933" height="405" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="980" y="306" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Product Rating &amp; Sentiment Matrix</text>

  <!-- Bottom Row Visuals (Clean: Title only) -->
  <g filter="url(#card-shadow)">
    <rect x="350" y="690" width="750" height="365" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="378" y="732" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Average Rating by Category</text>

  <g filter="url(#card-shadow)">
    <rect x="1122" y="690" width="763" height="365" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>
  <text x="1148" y="732" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="bold">Customer Satisfaction by Region</text>
</svg>